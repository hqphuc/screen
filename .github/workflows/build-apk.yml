name: Auto Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Tạo dự án Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          echo '{"appId":"com.p2p.mirror","appName":"ScreenMirror","webDir":"www"}' > capacitor.config.json
          echo '{"name":"app","version":"1.0.0","dependencies":{"@capacitor/android":"^6.0.0","@capacitor/cli":"^6.0.0","@capacitor/core":"^6.0.0"}}' > package.json
          npm install

      - name: 5. Thêm nền tảng Android
        run: |
          npx cap add android
          npx cap sync android

      - name: 6. Biên dịch APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Tải file APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
